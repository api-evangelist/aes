meters:
  - name: managed_assets_mw
    unit: MW
    aggregation: max
    dimensions:
      - asset_type
      - region
  - name: api_requests
    unit: request
    aggregation: sum
    dimensions:
      - tenant
      - environment
  - name: subscription_fees
    unit: year
    aggregation: sum
    dimensions:
      - product
principles:
  - name: Visibility
    description: Reconcile annual Fluence invoices against managed-asset MW figures and the SOW
      schedule.
  - name: Allocation
    description: Tag spend per asset portfolio and operating company.
  - name: Optimization
    description: Right-size Mosaic vs Nispera coverage to active assets; renegotiate at renewal
      based on portfolio size.
  - name: Accountability
    description: Assign portfolio-software owner; review annual renewal exposure.
