retired_endpoints:
  - host: api.aes.com
    product: 'AES Microgrid Energy API (inferred from the CNAME target name)'
    state: retired-and-dangling
    evidence:
      - 'dig api.aes.com CNAME +short -> microgridenergy-api.azurewebsites.net.'
      - 'dig microgridenergy-api.azurewebsites.net -> NXDOMAIN'
      - 'curl https://api.aes.com/ -> curl (6) Could not resolve host'
    note: >-
      The strongest single piece of evidence in this repo that AES once operated a
      public-facing API host. The CNAME survives; the Azure App Service behind it does
      not. Nothing was published about its retirement — no changelog, no sunset
      notice, no redirect. See security/aes-vulnerability-disclosure.yml for the
      takeover exposure the leftover record creates.
    checked: '2026-08-30'
