    product: 'AES supplier/partner portal (ServiceNow)'
    state: live-but-authenticated
    evidence:
      - 'dig portal.aes.com -> aesbigskyprod1.service-now.com'
      - 'https://portal.aes.com/ -> 200, title "Portal AES via ServiceNow"'
    note: >-
      A live ServiceNow tenant. ServiceNow instances expose a REST/Table API, but it
      sits behind tenant authentication and AES publishes no documentation for it, so
      it is recorded as an observed surface, not a contract.
    checked: '2026-08-30'
