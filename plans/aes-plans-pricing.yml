description: >-
  AES Corporation publishes no plans and no pricing page of any kind. It sells
  electricity under long-term power purchase agreements and regulated tariffs, not
  metered software access. The two software products in this catalog entry, Fluence
  Mosaic and Fluence Nispera, are sold by Fluence Energy, Inc. under enterprise
  contract; both product pages end in a contact form, and neither publishes a tier, a
  list price, an included quota or an overage rate.
notes: >-
  plan_count is 0 on purpose. A prior bulk sweep dated 2026-05-04 wrote a single
  invented tier here called "Fluence Enterprise" with price "contact sales"; that was
  a generated placeholder, not a published plan, and it has been removed. Recording
  the honest zero is the finding: an agent or a buyer evaluating AES cannot obtain a
  price without talking to sales, and that is a real property of this provider.
