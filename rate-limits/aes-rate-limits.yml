specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: AES Corporation
providerId: aes
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
notes: No publicly documented rate limits. Fluence platforms expose APIs to enterprise customers
  under contract; thresholds are configured per deployment.
tags:
  - Rate Limiting
  - Energy
  - Battery Storage
description: AES/Fluence does not publish public rate-limit documentation. Limits are governed
  by enterprise deployment terms.
sources:
  - https://fluenceenergy.com/
responseCodes:
  throttled: 429
  serviceUnavailable: 503
limits:
  - name: Enterprise deployment limit
    scope: account
    metric: varies
    limit: see Fluence deployment contract
policies:
  - name: Deployment-scoped
    description: Limits configured per Fluence Mosaic/Nispera tenant deployment.
  - name: Backoff
    description: Honor Retry-After; use exponential backoff with jitter.
